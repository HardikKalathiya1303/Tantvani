name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://tantvani-backend.onrender.com/api/health)
          echo "Backend status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Backend returned $STATUS"
          else
            echo "Backend is alive"
          fi
